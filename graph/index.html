<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DAG registry - provenance graph</title>
<style>
  :root { --bg:#0f1216; --panel:#171c23; --ink:#dfe6ee; --dim:#8b96a3; --dep:#4c9aff;
          --hist:#9e8cff; --err:#ff6b6b; --ok:#57d9a3; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  header { padding:14px 18px; border-bottom:1px solid #232a33; display:flex; gap:14px;
           align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  #drop { border:1.5px dashed #334050; border-radius:8px; padding:8px 14px; color:var(--dim); }
  main { display:grid; grid-template-columns:1fr 320px; height:calc(100vh - 57px); }
  #canvaswrap { overflow:auto; padding:18px; }
  svg text { fill:var(--ink); font-size:12px; }
  .node rect { fill:var(--panel); stroke:#334050; stroke-width:1.2; rx:6; cursor:pointer; }
  .node.sel rect { stroke:var(--dep); stroke-width:2.5; }
  .node.blast rect { stroke:var(--err); stroke-width:2; }
  .node.up rect { stroke:var(--ok); stroke-width:2; }
  .edge { stroke:var(--dep); stroke-width:1.4; fill:none; opacity:.75; }
  .edge.hist { stroke:var(--hist); stroke-dasharray:5 4; }
  .edge.cyc { stroke:var(--err); stroke-width:2.2; opacity:1; }
  aside { border-left:1px solid #232a33; background:var(--panel); padding:16px; overflow:auto; }
  aside h2 { font-size:14px; margin:0 0 4px; }
  aside h3 { font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em;
             margin:18px 0 6px; }
  .pill { display:inline-block; border:1px solid #334050; border-radius:12px; padding:1px 9px;
          margin:2px 3px 2px 0; font-size:12px; cursor:pointer; }
  .pill:hover { border-color:var(--dep); }
  .meta { color:var(--dim); font-size:12px; white-space:pre-wrap; word-break:break-all; }
  .legend { color:var(--dim); font-size:12px; }
  .legend b { color:var(--ink); font-weight:600; }
  #cycwarn { color:var(--err); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>DAG registry - provenance graph</h1>
  <label id="drop">load provenance.json <input type="file" id="file" accept=".json" hidden></label>
  <span class="legend"><b>blue</b> dependency &nbsp; <b>purple dashed</b> history (supersedes) &nbsp; <b>red</b> cycle &nbsp; select a node: <b>green</b> upstream chain, <b>red outline</b> blast radius (needs recheck)</span>
  <span id="cycwarn"></span>
</header>
<main>
  <div id="canvaswrap"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <aside id="side"><p class="meta">Self-contained viewer: the file is parsed locally in this page; nothing is fetched or sent anywhere.</p></aside>
</main>
<script>
"use strict";
const COLS = [["definition"],["hypothesis"],["axiom"],["theorem"],["tombstone"]];
const COLX = i => 60 + i*190, ROWY = r => 70 + r*74, W=150, H=44;
let DATA=null, SEL=null;

function load(text){
  const j = JSON.parse(text);
  if (j.spec !== "dagcheck-provenance/v1") throw new Error("not a dagcheck provenance/v1 file");
  DATA=j; SEL=null; render();
}
document.getElementById("file").addEventListener("change", e=>{
  const f=e.target.files[0]; if(!f) return;
  f.text().then(load).catch(err=>alert(err.message));
});
const dz=document.getElementById("drop");
dz.addEventListener("dragover",e=>e.preventDefault());
dz.addEventListener("drop",e=>{e.preventDefault();
  e.dataTransfer.files[0].text().then(load).catch(err=>alert(err.message));});

function layout(nodes){
  const pos={}, rows=[0,0,0,0,0];
  nodes.forEach(n=>{
    let ci = COLS.findIndex(c=>c.includes(n.type)); if(ci<0) ci=COLS.length-1;
    pos[n.id]={x:COLX(ci), y:ROWY(rows[ci]++)};
  });
  return pos;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function render(){
  const svg=document.getElementById("svg"), side=document.getElementById("side");
  svg.innerHTML=""; 
  const nodes=DATA.nodes||[], edges=DATA.edges||[];
  const pos=layout(nodes);
  const depCyc=new Set(DATA.cycles?.dependency||[]), supCyc=new Set(DATA.cycles?.supersedes||[]);
  document.getElementById("cycwarn").textContent =
    (depCyc.size?`dependency cycle: ${[...depCyc].join(", ")}  `:"")+
    (supCyc.size?`history cycle: ${[...supCyc].join(", ")}`:"");
  const up=new Set(SEL?(DATA.upstream?.[SEL]||[]):[]);
  const blast=new Set(SEL?(DATA.blast_radius?.[SEL]||[]):[]);
  const maxX=Math.max(0,...Object.values(pos).map(p=>p.x))+W+80;
  const maxY=Math.max(0,...Object.values(pos).map(p=>p.y))+H+80;
  svg.setAttribute("width",maxX); svg.setAttribute("height",maxY);
  const NS="http://www.w3.org/2000/svg";
  edges.forEach(e=>{
    const a=pos[e.from], b=pos[e.to]; if(!a||!b) return;
    const p=document.createElementNS(NS,"path");
    const x1=a.x+W, y1=a.y+H/2, x2=b.x, y2=b.y+H/2;
    const mx=(x1+x2)/2;
    p.setAttribute("d",`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);
    p.setAttribute("class","edge"+(e.kind==="supersedes"?" hist":"")+
      ((depCyc.has(e.from)&&depCyc.has(e.to))||(supCyc.has(e.from)&&supCyc.has(e.to))?" cyc":""));
    svg.appendChild(p);
  });
  nodes.forEach(n=>{
    const g=document.createElementNS(NS,"g");
    let cls="node"+(SEL===n.id?" sel":"")+(blast.has(n.id)?" blast":"")+(up.has(n.id)?" up":"");
    g.setAttribute("class",cls);
    const r=document.createElementNS(NS,"rect");
    r.setAttribute("x",pos[n.id].x); r.setAttribute("y",pos[n.id].y);
    r.setAttribute("width",W); r.setAttribute("height",H);
    const t1=document.createElementNS(NS,"text");
    t1.setAttribute("x",pos[n.id].x+10); t1.setAttribute("y",pos[n.id].y+18);
    t1.textContent=n.id+(n.status!=="active"?" ("+n.status+")":"");
    const t2=document.createElementNS(NS,"text");
    t2.setAttribute("x",pos[n.id].x+10); t2.setAttribute("y",pos[n.id].y+35);
    t2.setAttribute("fill","#8b96a3");
    t2.textContent=(n.label||"").slice(0,22);
    g.appendChild(r); g.appendChild(t1); g.appendChild(t2);
    g.addEventListener("click",()=>{SEL=(SEL===n.id?null:n.id); render();});
    svg.appendChild(g);
  });
  const selNode=nodes.find(n=>n.id===SEL);
  const pill=id=>`<span class="pill" onclick="SEL=${JSON.stringify(id)};render()">${esc(id)}</span>`;
  side.innerHTML = selNode ? `
    <h2>${esc(selNode.id)}</h2>
    <div class="meta">${esc(selNode.type)} / ${esc(selNode.status)}<br>fingerprint ${esc(selNode.fingerprint)}</div>
    <h3>Upstream chain (${up.size})</h3>
    <div>${[...up].map(pill).join("")||'<span class="meta">none</span>'}</div>
    <h3>Blast radius - needs recheck if this changes (${blast.size})</h3>
    <div>${[...blast].map(pill).join("")||'<span class="meta">nothing cites this</span>'}</div>
    <h3>Edges</h3>
    <div class="meta">${edges.filter(e=>e.from===SEL||e.to===SEL)
        .map(e=>`${esc(e.from)} -[${esc(e.kind)}]-> ${esc(e.to)}`).join("<br>")||"none"}</div>`
  : `<h2>${nodes.length} entries, ${edges.length} edges</h2>
     <p class="meta">generated from ${esc(DATA.generated_from||"?")}<br>today ${esc(DATA.today||"n/a")}</p>
     <h3>Notes</h3><div class="meta">${(DATA.notes||[]).map(esc).join("<br><br>")}</div>`;
}
</script>
</body>
</html>
